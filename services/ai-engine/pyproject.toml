[project]
name = "docmorph-ai-engine"
version = "0.1.0"
description = "Topic analysis and prompt-driven design patches behind provider-independent adapters"
requires-python = ">=3.12"
dependencies = ["docmorph-schema", "docmorph-renderer"]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]

[tool.uv.sources]
docmorph-schema = { workspace = true }
docmorph-renderer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docmorph_ai"]
