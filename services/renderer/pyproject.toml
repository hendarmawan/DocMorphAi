[project]
name = "docmorph-renderer"
version = "0.1.0"
description = "Deterministic HTML renderer for canonical DocMorph documents"
requires-python = ">=3.12"
dependencies = ["docmorph-schema"]

[tool.uv.sources]
docmorph-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docmorph_renderer"]
