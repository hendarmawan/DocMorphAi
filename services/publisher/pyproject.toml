[project]
name = "docmorph-publisher"
version = "0.1.0"
description = "Standalone HTML export and share-link primitives"
requires-python = ">=3.12"
dependencies = ["docmorph-schema", "docmorph-renderer"]

[tool.uv.sources]
docmorph-schema = { workspace = true }
docmorph-renderer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docmorph_publisher"]
