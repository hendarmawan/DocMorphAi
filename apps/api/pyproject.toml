[project]
name = "docmorph-api"
version = "0.1.0"
description = "DocMorph AI backend (FastAPI modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "redis>=5.2",
    "docmorph-schema",
    "docmorph-converter",
    "docmorph-renderer",
    "docmorph-ai-engine",
    "docmorph-publisher",
]

[project.optional-dependencies]
anthropic = ["docmorph-ai-engine[anthropic]"]

[project.scripts]
docmorph-api = "docmorph_api.main:run"

[tool.uv.sources]
docmorph-schema = { workspace = true }
docmorph-converter = { workspace = true }
docmorph-renderer = { workspace = true }
docmorph-ai-engine = { workspace = true }
docmorph-publisher = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docmorph_api"]
