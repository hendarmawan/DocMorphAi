[project]
name = "docmorph-schema"
version = "0.1.0"
description = "Canonical DocMorph document and design models (Python side of packages/document-schema)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/docmorph_schema"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "docmorph_schema/json"
