# Full local stack: docker compose -f infrastructure/docker/compose.yaml up --build
name: docmorph

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: docmorph
      POSTGRES_PASSWORD: docmorph
      POSTGRES_DB: docmorph
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmorph"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docmorph
      MINIO_ROOT_PASSWORD: docmorph-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 docmorph docmorph-secret &&
                  mc mb --ignore-existing local/docmorph"

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      DOCMORPH_ENV: development
      DOCMORPH_DATABASE_URL: postgresql+psycopg://docmorph:docmorph@postgres:5432/docmorph
      DOCMORPH_REDIS_URL: redis://redis:6379/0
      DOCMORPH_STORAGE_BACKEND: s3
      DOCMORPH_S3_ENDPOINT_URL: http://minio:9000
      DOCMORPH_S3_BUCKET: docmorph
      DOCMORPH_S3_ACCESS_KEY: docmorph
      DOCMORPH_S3_SECRET_KEY: docmorph-secret
      DOCMORPH_CORS_ORIGINS: '["http://localhost:3000"]'
      DOCMORPH_AI_PROVIDER: ${DOCMORPH_AI_PROVIDER:-heuristic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-setup: { condition: service_completed_successfully }

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      DOCMORPH_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
